# Cache rules (Cloudflare respects these). The resume PDF stays short so edits show up fast.
map $uri $cache_control {
    ~^/_next/static/              "public, max-age=31536000, immutable";
    ~\.pdf$                       "public, max-age=300, must-revalidate";
    ~\.(webp|png|jpg|svg|ico)$    "public, max-age=86400";
    default                       "public, max-age=0, must-revalidate";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS is terminated by Cloudflare; keep redirects relative to the incoming host.
    absolute_redirect off;

    # www -> apex
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control $cache_control always;

    location = /healthz { access_log off; return 200 "ok"; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
